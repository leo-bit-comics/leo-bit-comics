<title>Leo &amp; Bit's AI Adventure</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&family=Luckiest+Guy&family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@500;700&display=swap">
<style>
/* Layout: a comic-book reader. Masthead + language switch, cast strip, episode picker, then one episode at a time as a 2-column panel grid with a glossary and an activity box. */
:root{
  --ink:#17182B; --paper:#FFFFFF; --page:#E7EDF6; --dot:#CFD9EA;
  --leo:#2F6FD6; --bit:#22B8A7; --cap:#FFD84D; --hot:#C2416B; --zh:#3A4766; --muted:#56607A;
  --f-display:"Luckiest Guy","Arial Black",Impact,sans-serif;
  --f-zhd:"ZCOOL KuaiLe","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --f-en:"Comic Neue","Comic Sans MS","Chalkboard SE","Trebuchet MS",sans-serif;
  --f-zh:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--page) radial-gradient(var(--dot) 1.1px,transparent 1.4px) 0 0/14px 14px;color:var(--ink);font-family:var(--f-en);font-size:15px}
.sv-en{font-family:var(--f-en)} .sv-zh{font-family:var(--f-zh)} .sv-mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace} .sv-disp{font-family:var(--f-display)} .sv-zhd{font-family:var(--f-zhd)}
.wrap{max-width:1060px;margin:0 auto;padding-inline:16px;padding-block:20px 64px}
.en{display:block} .zh{display:block;font-family:var(--f-zh)}
.mode-en .zh,.mode-zh .en{display:none}

/* masthead */
.mast{display:grid;grid-template-columns:1fr auto;gap:16px 24px;align-items:center;background:var(--paper);border:3px solid var(--ink);box-shadow:6px 6px 0 var(--ink);padding:18px 20px;position:relative;overflow:hidden}
.mast::before{content:"";position:absolute;inset:0;background:radial-gradient(#FFE7A3 1.6px,transparent 2px) 0 0/10px 10px;opacity:.55;pointer-events:none}
.mast>*{position:relative;min-width:0}
.logo{margin:0;font-family:var(--f-display);font-weight:400;font-size:clamp(40px,7vw,72px);line-height:.95;letter-spacing:1px;color:var(--cap);-webkit-text-stroke:2.5px var(--ink);paint-order:stroke fill;text-shadow:4px 4px 0 var(--ink);text-wrap:balance}
.logo-zh{font-family:var(--f-zhd);font-size:clamp(26px,4vw,38px);color:var(--ink);margin:6px 0 0}
.tag{margin:10px 0 0;color:var(--muted);font-weight:700;max-width:52ch;line-height:1.4}
.tag .zh{font-weight:500}
.mast-art{width:190px;max-width:100%}
.langs{display:inline-flex;border:2.5px solid var(--ink);background:#fff;box-shadow:3px 3px 0 var(--ink);margin-top:14px}
.langs button{font:inherit;font-weight:700;border:0;background:transparent;padding:7px 14px;cursor:pointer;color:var(--ink)}
.langs button+button{border-left:2.5px solid var(--ink)}
.langs button[aria-pressed="true"]{background:var(--ink);color:#fff}
.langs button:focus-visible,.ep-btn:focus-visible,.nav button:focus-visible{outline:3px solid var(--leo);outline-offset:2px}

/* section heads */
.sh{display:flex;align-items:baseline;gap:10px;margin:34px 0 12px;font-family:var(--f-display);font-weight:400;font-size:22px;letter-spacing:.5px}
.sh .zh{font-family:var(--f-zhd);font-size:20px;display:inline}
.sh .en{display:inline}
.mode-both .sh .zh::before{content:"· ";color:var(--muted)}

/* cast */
.cast{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.cc{background:#fff;border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);display:grid;grid-template-columns:84px 1fr;gap:10px;align-items:center;padding:10px 12px;min-width:0}
.cc svg{width:84px;height:96px}
.cc h3{margin:0;font-family:var(--f-display);font-weight:400;font-size:20px;letter-spacing:.5px;color:var(--c)}
.cc h3 .zh{font-family:var(--f-zhd);font-size:18px;color:var(--ink)}
.mode-both .cc h3 .en,.mode-both .cc h3 .zh{display:inline}.mode-both .cc h3 .zh{margin-left:6px}
.cc p{margin:4px 0 0;font-size:14px;line-height:1.35;font-weight:700}
.cc p .zh{font-weight:500;color:var(--zh);font-size:13.5px;margin-top:2px}

/* episode picker */
.eps{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:10px}
.ep-btn{font:inherit;text-align:left;cursor:pointer;background:#fff;border:2.5px solid var(--ink);box-shadow:3px 3px 0 var(--ink);padding:8px 10px;display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:center;color:var(--ink);min-width:0;transition:transform .12s}
.ep-btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
.ep-btn .num{font-family:var(--f-display);font-size:22px;width:34px;height:34px;display:grid;place-items:center;background:var(--page);border:2px solid var(--ink);border-radius:50%}
.ep-btn .tt{font-weight:700;font-size:13.5px;line-height:1.2;min-width:0}
.ep-btn .tt .zh{font-weight:500;font-size:12.5px;color:var(--zh)}
.ep-btn[aria-current="true"]{background:var(--cap)}
.ep-btn[aria-current="true"] .num{background:#fff}

/* episode */
.ep-head{margin:36px 0 16px;display:flex;flex-wrap:wrap;gap:12px 18px;align-items:flex-end}
.ep-no{font-family:var(--f-display);font-size:18px;background:var(--ink);color:var(--cap);padding:6px 12px;transform:rotate(-3deg);letter-spacing:1px}
.ep-no .zh{font-family:var(--f-zhd);color:#fff;font-size:15px}
.ep-title{margin:0;font-family:var(--f-display);font-weight:400;font-size:clamp(30px,5vw,46px);line-height:1;letter-spacing:.5px;text-wrap:balance}
.ep-title .zh{font-family:var(--f-zhd);font-size:.72em;margin-top:6px;color:var(--hot)}
.ep-topic{border:2.5px solid var(--ink);background:#fff;padding:5px 10px;font-weight:700;font-size:14px;border-radius:999px}
.mode-both .ep-topic .en,.mode-both .ep-topic .zh{display:inline}.mode-both .ep-topic .zh::before{content:" / ";color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.panel{margin:0;background:var(--top);border:3px solid var(--ink);box-shadow:5px 5px 0 var(--ink);display:flex;flex-direction:column;overflow:hidden;min-width:0;position:relative}
.pn{position:absolute;top:0;left:0;background:var(--ink);color:#fff;font-family:var(--f-display);font-size:13px;padding:2px 7px 0;z-index:3}
.bubbles{display:flex;flex-direction:column;gap:13px;padding:12px 12px 14px;position:relative;z-index:2}
.art{display:block;width:100%;height:auto;margin-top:auto}
.b{background:#fff;border:2.5px solid var(--ink);border-radius:18px;padding:8px 13px 9px;max-width:90%;position:relative;line-height:1.3;font-weight:700;font-size:15.5px}
.b::after{content:"";position:absolute;bottom:-9px;width:14px;height:14px;background:#fff;border-right:2.5px solid var(--ink);border-bottom:2.5px solid var(--ink);transform:rotate(45deg)}
.b.l{align-self:flex-start}.b.l::after{left:24px}
.b.r{align-self:flex-end}.b.r::after{right:24px}
.b.c{align-self:center}.b.c::after{left:calc(50% - 7px)}
.b .who{display:inline-block;font-family:var(--f-en);font-size:11.5px;letter-spacing:.4px;text-transform:uppercase;color:#fff;background:var(--c);border-radius:999px;padding:1px 8px;margin:0 0 4px -2px}
.mode-zh .b .who{text-transform:none}
.b .zh,.cap .zh{font-weight:500;font-size:14.5px;color:var(--zh);line-height:1.5}
.mode-both .b .zh{border-top:1.5px dashed #C8D0E0;margin-top:5px;padding-top:4px}
.mode-zh .b .zh,.mode-zh .cap .zh{color:var(--ink);font-size:15.5px}
.cap{align-self:flex-start;max-width:92%;background:var(--cap);border:2.5px solid var(--ink);box-shadow:2px 2px 0 var(--ink);padding:5px 11px;font-size:14px;font-weight:700;line-height:1.3;margin-left:22px}
.mode-both .cap .zh{margin-top:2px;font-size:13.5px}
.panel[style*="#0E1A33"] .cap{box-shadow:2px 2px 0 #7DF9FF}

/* glossary + activity */
.after{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:18px;margin-top:26px}
.box{background:#fff;border:3px solid var(--ink);box-shadow:5px 5px 0 var(--ink);padding:16px 18px;min-width:0}
.box h3{margin:0 0 10px;font-family:var(--f-display);font-weight:400;font-size:20px;letter-spacing:.5px}
.box h3 .zh{font-family:var(--f-zhd);font-size:18px}
.mode-both .box h3 .en,.mode-both .box h3 .zh{display:inline}.mode-both .box h3 .zh::before{content:" · ";color:var(--muted)}
.terms{display:grid;gap:10px;margin:0}
.term{display:grid;grid-template-columns:minmax(0,10em) minmax(0,1fr);gap:4px 14px;padding-top:10px;border-top:2px dotted #C8D0E0}
.term:first-child{border-top:0;padding-top:0}
.term dt{font-weight:700;color:var(--leo);font-size:15px;line-height:1.3}
.term dt .zh{color:var(--hot);font-weight:700;font-size:14.5px}
.term dd{margin:0;font-size:14.5px;line-height:1.4}
.term dd .zh{color:var(--zh);font-size:14px;margin-top:2px}
.try{background:var(--cap)}
.try p{margin:0;font-weight:700;line-height:1.45;font-size:15.5px}
.try p .zh{font-weight:500;margin-top:8px;color:var(--ink)}
.try .note{margin-top:14px;font-size:13px;font-weight:700;color:#5a4a10;border-top:2px dashed var(--ink);padding-top:10px}
.try .note .zh{font-weight:500;margin-top:2px}
.nav{display:flex;justify-content:space-between;gap:12px;margin-top:26px}
.nav button{font:inherit;font-weight:700;cursor:pointer;background:#fff;border:2.5px solid var(--ink);box-shadow:3px 3px 0 var(--ink);padding:10px 16px;color:var(--ink);max-width:48%;text-align:left}
.nav button:last-child{text-align:right;margin-left:auto}
.nav button[disabled]{visibility:hidden}
.nav small{display:block;font-size:12px;color:var(--muted)}
.nav .zh{font-weight:500}
.foot{margin-top:40px;text-align:center;color:var(--muted);font-size:13px;font-weight:700}
.foot .zh{font-weight:500}

@media (max-width:820px){.cast{grid-template-columns:1fr}.after{grid-template-columns:1fr}}
@media (max-width:700px){.grid{grid-template-columns:1fr}.mast{grid-template-columns:1fr}.mast-art{display:none}.b{font-size:15px}.term{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.ep-btn{transition:none}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
// ===== Script: 13 episodes, 6 panels each. cast: [who, x, expression, pose, opts] =====
const T=(en,zh)=>({en,zh});
const EPISODES=[
// ---------- 1 ----------
{t:T("Meet Bit","遇见比特"),topic:T("What is a computer?","计算机是什么？"),
panels:[
{bg:'room-night',props:[['desk',292],['laptop',292,'glow']],cast:[['leo',160,'worried','idle']],fx:[['sweat','leo']],
 say:[['nar',"Shanghai. Friday, 9 p.m.","上海，周五晚上九点。"],
      ['leo',"The science fair is in 12 weeks and I still have NO idea what to build...","科学节还有12周，我还完全不知道该做什么……"]]},
{bg:'burst',cast:[['leo',95,'surprised','cheer'],['bit',290,'happy','wave',{y:118}]],fx:[['!','leo'],['sparkles',290,110]],
 say:[['bit',"Hi! I'm Bit, the smallest piece of information in a computer. I live in your laptop!","嗨！我是比特，计算机里最小的信息单位。我就住在你的笔记本电脑里！"],
      ['leo',"A ROBOT just came out of my laptop?!","我的电脑里……蹦出来一个机器人？！"]]},
{bg:'room-night',holo:{t:'flow',title:T("What a computer does","计算机做什么"),steps:[{i:'key',l:T("Input","输入")},{i:'chip',l:T("Process","处理")},{i:'screen',l:T("Output","输出")}],foot:T("Keyboard → CPU → Screen","键盘 → CPU → 屏幕")},
 cast:[['leo',54,'think','think'],['bit',356,'talk','present']],
 say:[['leo',"Okay... so what IS a computer, really?","好吧……那计算机到底是什么？"],
      ['bit',"A machine that follows instructions to turn input into output. Super, super fast.","一台按照指令工作的机器：把输入变成输出，而且超级快。"]]},
{bg:'room-night',holo:{t:'list',title:T("Main parts","主要部件"),items:[{i:'chip',l:T("CPU: the brain that calculates","CPU：负责计算的“大脑”")},{i:'desk',l:T("Memory (RAM): the desk for work in progress","内存：放正在做的事的“书桌”")},{i:'shelf',l:T("Storage: the bookshelf that keeps files","硬盘：长期保存文件的“书架”")}]},
 cast:[['leo',54,'surprised','idle'],['bit',356,'talk','present']],
 say:[['bit',"The CPU does billions of tiny steps every second.","CPU每秒能完成几十亿个小步骤。"],
      ['leo',"Billions? Every SECOND?!","几十亿？每一秒？！"]]},
{bg:'room-night',holo:{t:'flow',title:T("Playing a game","玩游戏的时候"),steps:[{i:'key',l:T("Press W","按下W")},{i:'chip',l:T("Run game code","运行游戏代码")},{i:'game',l:T("Player moves","角色前进")}]},
 cast:[['leo',54,'grin','point'],['bit',356,'happy','present']],
 say:[['leo',"So when I press W in my game...","所以我在游戏里按下W键的时候……"],
      ['bit',"The keyboard sends a signal, the CPU runs the game's instructions, and the screen draws you moving. Input, process, output!","键盘发出信号，CPU执行游戏指令，屏幕画出你向前走。输入、处理、输出！"]]},
{bg:'room-night',cast:[['leo',125,'determined','point'],['bit',285,'wink','wave']],
 say:[['leo',"Bit, help me build an AI for the science fair!","比特，帮我做一个AI去参加科学节吧！"],
      ['bit',"Deal! But first you need to know how computers think. Lesson one tomorrow: zeros and ones.","成交！不过你得先弄懂计算机是怎么“思考”的。明天第一课：0和1。"]]}
],
terms:[["Input / Output","输入 / 输出","Information going in (keyboard, mic, camera) and coming out (screen, speaker).","进入计算机的信息（键盘、麦克风、摄像头）和出来的信息（屏幕、音箱）。"],
 ["CPU","中央处理器（CPU）","The chip that carries out instructions, billions every second.","执行指令的芯片，每秒执行几十亿条。"],
 ["Memory (RAM)","内存","Fast, temporary space for what is running now. Cleared when the power goes off.","存放正在运行内容的高速临时空间，断电就清空。"],
 ["Storage","存储（硬盘）","Keeps your files even when the power is off.","断电后也能保存文件。"]],
tryIt:T("Walk around your home and list 5 input devices and 5 output devices. Is a touchscreen input or output?","在家里找一找：列出5个输入设备和5个输出设备。触摸屏算输入还是输出？")},

// ---------- 2 ----------
{t:T("Zeros and Ones","0和1的秘密"),topic:T("Binary","二进制"),
panels:[
{bg:'kitchen',props:[['table',205],['bowl',205,172]],cast:[['leo',100,'surprised','idle'],['bit',300,'talk','wave',{y:100}]],
 say:[['nar',"Saturday breakfast.","周六早餐时间。"],
      ['bit',"Everything in a computer is stored as 0s and 1s.","计算机里的一切，都是用0和1存起来的。"],
      ['leo',"Everything? Even my photos and game saves?","一切？连我的照片和游戏存档也是？"]]},
{bg:'kitchen',holo:{t:'bulbs',title:T("One switch = one bit","一个开关 = 一个比特"),bits:'01',caps:[T("OFF","关"),T("ON","开")]},
 cast:[['leo',54,'think','think'],['bit',356,'happy','present']],
 say:[['bit',"Inside the chip are billions of tiny switches. Off means 0, on means 1. One switch is one bit. That's me!","芯片里有几十亿个微小的开关。关代表0，开代表1。一个开关就是一个比特——就是我！"]]},
{bg:'kitchen',holo:{t:'bulbs',title:T("8 bits = 1 byte","8个比特 = 1个字节"),bits:'10110010',pv:true,foot:T("2⁸ = 256 patterns","2⁸ = 256 种组合")},
 cast:[['leo',54,'grin','point'],['bit',356,'talk','present']],
 say:[['bit',"Put 8 bits together and you get a byte. 8 switches can make 256 different patterns.","把8个比特放在一起，就是1个字节。8个开关能组成256种不同的图案。"],
      ['leo',"2×2×2×2×2×2×2×2... that's 256!","2×2×2×2×2×2×2×2……正好256！"]]},
{bg:'kitchen',holo:{t:'big',title:T("Letters are numbers","文字也是数字"),rows:[{s:'A = 65',size:22},{s:'= 01000001',size:15,mono:true,fill:'#C2416B'},{s:'中 = 20013',size:22}]},
 cast:[['leo',54,'surprised','idle'],['bit',356,'talk','present']],
 say:[['bit',"Computers agree on codes. 65 means the letter A. Chinese characters use bigger numbers: in Unicode, 中 is 20013.","计算机之间约定好了编码：65代表字母A。汉字用更大的数字，在Unicode里，“中”是20013。"]]},
{bg:'kitchen',holo:{t:'pixels',title:T("A photo = a grid of pixels","照片 = 像素网格")},
 cast:[['leo',54,'think','think'],['bit',356,'talk','present']],
 say:[['bit',"A picture is a grid of tiny dots called pixels. Each pixel's color is three numbers: red, green and blue.","图片是由很多叫“像素”的小点组成的网格。每个像素的颜色用三个数字表示：红、绿、蓝。"],
      ['leo',"So a photo is just a giant list of numbers?!","所以一张照片就是一大串数字？！"]]},
{bg:'class',cast:[['mia',80,'smirk','idle'],['leo',195,'grin','idle'],['bit',320,'happy','wave']],
 say:[['nar',"Monday, at school. Leo introduces Bit to his classmate Mia.","周一，学校里。乐乐把比特介绍给同学米娅。"],
      ['mia',"A pocket robot? Fine. But can it count to 1,000 on its fingers?","口袋机器人？好吧。那它能用手指数到1000吗？"],
      ['bit',"With binary, your 10 fingers can count all the way to 1,023!","用二进制，你的10根手指能一直数到1023！"]]}
],
terms:[["Binary","二进制","A way of counting with only two digits: 0 and 1.","只用0和1两个数字的计数方法。"],
 ["Bit","比特","One 0 or 1, the smallest unit of information.","一个0或1，最小的信息单位。"],
 ["Byte","字节","8 bits. One English letter usually takes 1 byte.","8个比特。一个英文字母通常占1个字节。"],
 ["Pixel","像素","One tiny colored dot in a picture.","图片中的一个彩色小点。"]],
tryIt:T("Count in binary on one hand: thumb = 1, index = 2, middle = 4, ring = 8, pinky = 16. Which fingers do you raise to make 13?","用一只手数二进制：拇指=1，食指=2，中指=4，无名指=8，小指=16。要表示13，该竖起哪几根手指？")},

// ---------- 3 ----------
{t:T("Step by Step","一步一步来"),topic:T("Algorithms","算法"),
panels:[
{bg:'kitchen',props:[['stove',300]],cast:[['leo',150,'happy','hold'],['bit',330,'talk','wave',{y:80}]],
 say:[['nar',"Leo is cooking tomato and egg stir-fry.","乐乐正在做番茄炒蛋。"],
      ['bit',"A recipe is an algorithm: clear steps, in order, that solve a problem.","菜谱就是一种算法：按顺序排好的清晰步骤，用来解决一个问题。"]]},
{bg:'kitchen',holo:{t:'list',num:true,size:10,title:T("Algorithm: tomato & egg","算法：番茄炒蛋"),items:[{l:T("Beat 3 eggs","打散3个鸡蛋")},{l:T("Cut 2 tomatoes","切好2个番茄")},{l:T("Heat the oil","锅里热油")},{l:T("Scramble eggs, set aside","炒熟鸡蛋，盛出")},{l:T("Cook tomatoes, add eggs","炒番茄，倒回鸡蛋")},{l:T("Add salt. Done!","加盐，出锅！")}]},

      [['#8B5A2B',34],['#2D6CDF',30],['#3A3A44',27],['#E04848',22]].forEach(([c,h],i)=>{s+=`<rect x="${x-30+i*16}" y="${186-h}" width="11" height="${h}" fill="${c}" stroke="${INK}" stroke-width="1.2"/>`;});
      s+=`<g transform="translate(${x-60},130) scale(.9)">${pic('banana',0,0,0.7)}</g><g transform="translate(${x-60},165) scale(.9)">${pic('bottle',0,0,0.6)}</g><g transform="translate(${x+60},140) scale(.9)">${pic('tissue',0,0,0.7)}</g>`;return s;}
    case 'medal': {const y=a;return `<path d="M${x-12} ${y-34} L${x-4} ${y-8} L${x+4} ${y-8} L${x-4} ${y-34} Z" fill="#2F6FD6" stroke="${INK}" stroke-width="2"/><path d="M${x+12} ${y-34} L${x+4} ${y-8} L${x-4} ${y-8} L${x+4} ${y-34} Z" fill="#FF5D5D" stroke="${INK}" stroke-width="2"/><circle cx="${x}" cy="${y+6}" r="18" fill="#FFC83D" stroke="${INK}" stroke-width="2.5"/><circle cx="${x}" cy="${y+6}" r="12" fill="none" stroke="#E0A21B" stroke-width="2"/>${star(x,y+6,8,'#fff')}`;}
    case 'phone': {const y=a;return `<g transform="rotate(-12 ${x} ${y})"><rect x="${x-7}" y="${y-12}" width="14" height="24" rx="3" fill="#2B2F45" stroke="${INK}" stroke-width="2"/><rect x="${x-5}" y="${y-9}" width="10" height="17" fill="#7DF9FF"/></g>`;}
  }
  return '';}
function star(x,y,r,fill){let pts=[];for(let i=0;i<10;i++){const a=(-90+i*36)*Math.PI/180,rr=i%2?r*0.45:r;pts.push(`${n1(x+rr*Math.cos(a))},${n1(y+rr*Math.sin(a))}`);}return `<polygon points="${pts.join(' ')}" fill="${fill}" stroke="${INK}" stroke-width="1.4" stroke-linejoin="round"/>`;}
function sparkle(x,y,r=8){return `<path d="M${x} ${y-r} Q${x} ${y} ${x+r} ${y} Q${x} ${y} ${x} ${y+r} Q${x} ${y} ${x-r} ${y} Q${x} ${y} ${x} ${y-r} Z" fill="#FFF3B0" stroke="${INK}" stroke-width="1.5" stroke-linejoin="round"/>`;}
function fxDraw(f,castMap){const [k,a,b]=f;let x=a,y=b;
  if(typeof a==='string'){const c=castMap[a];if(!c) return '';const [who,cx,,,o]=c;const fc=facing(c);
    if(who==='bit'){x=cx;y=(o&&o.y)||108;y-=56;} else {const s=LOOK[who].s;x=cx+fc*30*s;y=242-200*s;}
    if(k==='sweat'){ if(who==='bit'){x+= -fc*30;y+=30;} else {x=cx-fc*36*LOOK[who].s;y=242-170*LOOK[who].s;} }
    if(k==='stars'){x=cx;}
  }
  switch(k){
    case '!': return `<text x="${n1(x)}" y="${n1(y)}" font-size="34" text-anchor="middle" fill="#FF5D5D" stroke="${INK}" stroke-width="1.6" class="sv-disp">!</text>`;
    case '?': return `<text x="${n1(x)}" y="${n1(y)}" font-size="30" text-anchor="middle" fill="#2F6FD6" stroke="${INK}" stroke-width="1.5" class="sv-disp">?</text>`;
    case 'sweat': return `<path d="M${n1(x)} ${n1(y)} C${n1(x+6)} ${n1(y+9)} ${n1(x+6)} ${n1(y+14)} ${n1(x)} ${n1(y+14)} C${n1(x-6)} ${n1(y+14)} ${n1(x-6)} ${n1(y+9)} ${n1(x)} ${n1(y)} Z" fill="#9FD4F7" stroke="${INK}" stroke-width="1.6"/>`;
    case 'sparkles': return sparkle(x-50,y-30,9)+sparkle(x+48,y-38,7)+sparkle(x+56,y+26,10)+sparkle(x-58,y+30,6);
    case 'stars': return [0,120,240].map(d=>{const r=d*Math.PI/180;return star(n1(x+30*Math.cos(r)),n1(y+6+8*Math.sin(r)),7,'#FFD84D');}).join('');
    case 'moth': return `<g transform="translate(${x},${y})"><ellipse cx="-9" cy="-2" rx="11" ry="8" fill="#C9B79C" stroke="${INK}" stroke-width="1.6" transform="rotate(-20 -9 -2)"/><ellipse cx="9" cy="-2" rx="11" ry="8" fill="#C9B79C" stroke="${INK}" stroke-width="1.6" transform="rotate(20 9 -2)"/><ellipse cx="0" cy="0" rx="3.5" ry="9" fill="#6B5A44" stroke="${INK}" stroke-width="1.4"/><path d="M-1 -8 Q-5 -16 -8 -16 M1 -8 Q5 -16 8 -16" stroke="${INK}" stroke-width="1.3" fill="none"/></g><path d="M${x-30} ${y+8} q6 -4 12 0 M${x-34} ${y+16} q6 -4 12 0" stroke="${INK}" stroke-width="1.4" fill="none"/>`;
  }
  return '';}
function facing(c){const o=c[4]||{};return o.f??(c[1]<200?1:-1);}

// ---------- panel ----------
const NAMES={leo:{en:'Leo',zh:'乐乐',c:'#2F6FD6'},bit:{en:'Bit',zh:'比特',c:'#0F8576'},mia:{en:'Mia',zh:'米娅',c:'#C2416B'},wang:{en:'Ms. Wang',zh:'王老师',c:'#8C3B52'}};
function artSVG(p){
  const sc=SCENES[p.bg];let svg=sc.draw();const cm={};(p.cast||[]).forEach(c=>cm[c[0]]=c);
  if(p.holo){const b=cm.bit;
    if(b&&b[3]==='present'){const f=facing(b),o=b[4]||{},s=o.s||1.05,by=o.y||108;const ex=f<0?HOLO.x+HOLO.w:HOLO.x;const fx=b[1]+f*20*s;
      svg+=`<polygon points="${n1(fx)},${n1(by-6)} ${ex},${HOLO.y+26} ${ex},${HOLO.y+HOLO.h-26}" fill="#7DF9FF" opacity=".28"/>`;}
    svg+=holo(p.holo);}
  const front=['phone','medal'];
  (p.props||[]).filter(q=>!front.includes(q[0])).forEach(q=>svg+=prop(q));
  (p.cast||[]).forEach(c=>{const [who,x,e,pose,o={}]=c;const f=facing(c);
    if(who==='bit') svg+=bit(x,o.y||108,f,o.s||1.05,e,pose); else svg+=person(who,x,242,f,o.s||LOOK[who].s,e,pose);});
  (p.props||[]).filter(q=>front.includes(q[0])).forEach(q=>svg+=prop(q));
  (p.fx||[]).forEach(f=>svg+=fxDraw(f,cm));
  return `<svg class="art" viewBox="0 0 400 250" aria-hidden="true" focusable="false">${svg}</svg>`;}
function hx(o){if(!isObj(o)) return esc(o);if(MODE==='en') return `<span class="en">${esc(o.en)}</span>`;if(MODE==='zh') return `<span class="zh">${esc(o.zh)}</span>`;return `<span class="en">${esc(o.en)}</span><span class="zh">${esc(o.zh)}</span>`;}
function bubbles(p){const cm={};(p.cast||[]).forEach(c=>cm[c[0]]=c);
  return (p.say||[]).map(([who,en,zh])=>{const body=hx({en,zh});
    if(who==='nar') return `<div class="cap">${body}</div>`;
    const c=cm[who];const x=c?c[1]:200;const side=x<150?'l':x>250?'r':'c';const N=NAMES[who];
    const name=MODE==='both'?`${N.en} · ${N.zh}`:pick(N);
    return `<div class="b ${side}"><span class="who" style="--c:${N.c}">${esc(name)}</span>${body}</div>`;}).join('');}
function panelHTML(p,i){return `<figure class="panel" style="--top:${SCENES[p.bg].top}"><span class="pn">${i+1}</span><div class="bubbles">${bubbles(p)}</div>${artSVG(p)}</figure>`;}


const CAST=[
  {k:'leo',name:NAMES.leo,bio:T("13, lives in Shanghai. Loves football and video games. Curious about everything.","13岁，住在上海。爱踢足球、爱打游戏，对什么都好奇。")},
  {k:'bit',name:NAMES.bit,bio:T("A pocket-sized robot who lives in Leo's laptop. Named after the smallest unit of information.","住在乐乐笔记本电脑里的口袋机器人，名字来自最小的信息单位。")},
  {k:'mia',name:NAMES.mia,bio:T("Leo's classmate. Sharp and skeptical. Always asks: how do you know?","乐乐的同学。聪明、爱质疑，总爱问：你怎么知道？")},
];
const UI={
  tag:T("13 comic episodes for curious 13-year-olds: from zeros and ones to AI agents.","写给13岁好奇少年的13集漫画：从0和1一路讲到AI智能体。"),
  cast:T("Meet the cast","主要角色"),eps:T("Episodes","全部剧集"),terms:T("Key words","关键词"),tryIt:T("Try it","动手试试"),
  prev:T("Previous","上一集"),next:T("Next","下一集"),
  note:T("Parents: read one episode a week together, then do the activity.","家长小贴士：每周一起读一集，再完成这个小活动。"),
  foot:T("Leo, Bit and Mia are original characters. Fun facts checked in 2026.","乐乐、比特和米娅均为原创角色。文中知识点核对于2026年。"),
};
let CUR=0;
try{const m=localStorage.getItem('lb-mode');if(m==='en'||m==='zh'||m==='both')MODE=m;const e=parseInt(localStorage.getItem('lb-ep'),10);if(e>=0&&e<EPISODES.length)CUR=e;}catch(e){}
const hm=/^#ep(\d+)$/.exec(location.hash);if(hm){const e=parseInt(hm[1],10)-1;if(e>=0&&e<EPISODES.length)CUR=e;}

function portrait(k){if(k==='bit') return `<svg viewBox="-56 -60 112 128" aria-hidden="true">${bit(0,0,1,1.25,'happy','wave')}</svg>`;
  return `<svg viewBox="-62 -212 124 220" aria-hidden="true">${person(k,0,0,1,1,k==='mia'?'smirk':'happy',k==='leo'?'wave':'idle')}</svg>`;}
function epNo(i){return MODE==='zh'?`<span class="zh">第${i+1}集</span>`:MODE==='en'?`<span class="en">EPISODE ${i+1}</span>`:`<span class="en">EPISODE ${i+1}</span><span class="zh">第${i+1}集</span>`;}
function render(){
  const app=document.getElementById('app');document.documentElement.lang=MODE==='zh'?'zh-CN':'en';
  document.body.className='mode-'+MODE;
  const E=EPISODES[CUR];
  const langs=[['both','EN + 中文'],['en','English'],['zh','中文']].map(([m,l])=>`<button type="button" data-mode="${m}" aria-pressed="${MODE===m}">${l}</button>`).join('');
  let h=`<header class="mast"><div><h1 class="logo">Leo &amp; Bit</h1><p class="logo-zh">乐乐和比特的AI大冒险</p><p class="tag">${hx(UI.tag)}</p><div class="langs" role="group" aria-label="Language">${langs}</div></div>
    <svg class="mast-art" viewBox="0 -215 260 225" aria-hidden="true">${person('leo',80,0,1,1,'grin','point')}${bit(200,-120,-1,1.3,'happy','wave')}</svg></header>`;
  h+=`<h2 class="sh">${hx(UI.cast)}</h2><div class="cast">${CAST.map(c=>`<div class="cc" style="--c:${c.name.c}">${portrait(c.k)}<div><h3>${hx(c.name)}</h3><p>${hx(c.bio)}</p></div></div>`).join('')}</div>`;
  h+=`<h2 class="sh">${hx(UI.eps)}</h2><nav class="eps" aria-label="Episodes">${EPISODES.map((e,i)=>`<button type="button" class="ep-btn" data-ep="${i}" aria-current="${i===CUR}"><span class="num">${i+1}</span><span class="tt">${hx(e.t)}</span></button>`).join('')}</nav>`;
  h+=`<section id="episode"><div class="ep-head"><span class="ep-no">${epNo(CUR)}</span><h2 class="ep-title">${hx(E.t)}</h2><span class="ep-topic">${hx(E.topic)}</span></div>`;
  h+=`<div class="grid">${E.panels.map(panelHTML).join('')}</div>`;
  h+=`<div class="after"><div class="box"><h3>${hx(UI.terms)}</h3><dl class="terms">${E.terms.map(t=>`<div class="term"><dt>${hx({en:t[0],zh:t[1]})}</dt><dd>${hx({en:t[2],zh:t[3]})}</dd></div>`).join('')}</dl></div>
    <div class="box try"><h3>${hx(UI.tryIt)}</h3><p>${hx(E.tryIt)}</p><div class="note">${hx(UI.note)}</div></div></div>`;
  const pv=EPISODES[CUR-1],nx=EPISODES[CUR+1];
  h+=`<div class="nav"><button type="button" data-go="${CUR-1}" ${pv?'':'disabled'}><small>← ${hx(UI.prev)}</small>${pv?hx(pv.t):''}</button><button type="button" data-go="${CUR+1}" ${nx?'':'disabled'}><small>${hx(UI.next)} →</small>${nx?hx(nx.t):''}</button></div></section>`;
  h+=`<p class="foot">${hx(UI.foot)}</p>`;
  app.innerHTML=h;
}
function go(i,scroll){CUR=i;try{localStorage.setItem('lb-ep',String(i));}catch(e){}
  try{history.replaceState(null,'','#ep'+(i+1));}catch(e){}
  render();if(scroll){const el=document.getElementById('episode');if(el)el.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'});}}
document.addEventListener('click',ev=>{const t=ev.target.closest('button');if(!t)return;
  if(t.dataset.mode){MODE=t.dataset.mode;try{localStorage.setItem('lb-mode',MODE);}catch(e){}render();}
  else if(t.dataset.ep!==undefined) go(+t.dataset.ep,true);
  else if(t.dataset.go!==undefined) go(+t.dataset.go,true);});
render();
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>render());
</script>
</body>
