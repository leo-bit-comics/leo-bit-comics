<style>
/* Layout: a comic-book reader. Masthead + language switch, cast strip, episode picker, then one episode at a time as a 2-column panel grid with a glossary and an activity box. */
:root{
  --ink:#17182B; --paper:#FFFFFF; --page:#E7EDF6; --dot:#CFD9EA;
  --leo:#2F6FD6; --bit:#22B8A7; --cap:#FFD84D; --hot:#C2416B; --zh:#3A4766; --muted:#56607A;
  --f-display:"Luckiest Guy","Arial Black",Impact,sans-serif;
  --f-zhd:"ZCOOL KuaiLe","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --f-en:"Comic Neue","Comic Sans MS","Chalkboard SE","Trebuchet MS",sans-serif;
  --f-zh:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--page) radial-gradient(var(--dot) 1.1px,transparent 1.4px) 0 0/14px 14px;color:var(--ink);font-family:var(--f-en);font-size:15px}
.sv-en{font-family:var(--f-en)} .sv-zh{font-family:var(--f-zh)} .sv-mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace} .sv-disp{font-family:var(--f-display)} .sv-zhd{font-family:var(--f-zhd)}
.wrap{max-width:1060px;margin:0 auto;padding-inline:16px;padding-block:20px 64px}
.en{display:block} .zh{display:block;font-family:var(--f-zh)}
.mode-en .zh,.mode-zh .en{display:none}

/* masthead */
.mast{display:grid;grid-template-columns:1fr auto;gap:16px 24px;align-items:center;background:var(--paper);border:3px solid var(--ink);box-shadow:6px 6px 0 var(--ink);padding:18px 20px;position:relative;overflow:hidden}
.mast::before{content:"";position:absolute;inset:0;background:radial-gradient(#FFE7A3 1.6px,transparent 2px) 0 0/10px 10px;opacity:.55;pointer-events:none}
.mast>*{position:relative;min-width:0}
.logo{margin:0;font-family:var(--f-display);font-weight:400;font-size:clamp(40px,7vw,72px);line-height:.95;letter-spacing:1px;color:var(--cap);-webkit-text-stroke:2.5px var(--ink);paint-order:stroke fill;text-shadow:4px 4px 0 var(--ink);text-wrap:balance}
.logo-zh{font-family:var(--f-zhd);font-size:clamp(26px,4vw,38px);color:var(--ink);margin:6px 0 0}
.tag{margin:10px 0 0;color:var(--muted);font-weight:700;max-width:52ch;line-height:1.4}
.tag .zh{font-weight:500}
.mast-art{width:190px;max-width:100%}
.langs{display:inline-flex;border:2.5px solid var(--ink);background:#fff;box-shadow:3px 3px 0 var(--ink);margin-top:14px}
.langs button{font:inherit;font-weight:700;border:0;background:transparent;padding:7px 14px;cursor:pointer;color:var(--ink)}
.langs button+button{border-left:2.5px solid var(--ink)}
.langs button[aria-pressed="true"]{background:var(--ink);color:#fff}
.langs button:focus-visible,.ep-btn:focus-visible,.nav button:focus-visible{outline:3px solid var(--leo);outline-offset:2px}

/* section heads */
.sh{display:flex;align-items:baseline;gap:10px;margin:34px 0 12px;font-family:var(--f-display);font-weight:400;font-size:22px;letter-spacing:.5px}
.sh .zh{font-family:var(--f-zhd);font-size:20px;display:inline}
.sh .en{display:inline}
.mode-both .sh .zh::before{content:"· ";color:var(--muted)}

/* cast */
.cast{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.cc{background:#fff;border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);display:grid;grid-template-columns:84px 1fr;gap:10px;align-items:center;padding:10px 12px;min-width:0}
.cc svg{width:84px;height:96px}
.cc h3{margin:0;font-family:var(--f-display);font-weight:400;font-size:20px;letter-spacing:.5px;color:var(--c)}
.cc h3 .zh{font-family:var(--f-zhd);font-size:18px;color:var(--ink)}
.mode-both .cc h3 .en,.mode-both .cc h3 .zh{display:inline}.mode-both .cc h3 .zh{margin-left:6px}
.cc p{margin:4px 0 0;font-size:14px;line-height:1.35;font-weight:700}
.cc p .zh{font-weight:500;color:var(--zh);font-size:13.5px;margin-top:2px}

/* episode picker */
.eps{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:10px}
.ep-btn{font:inherit;text-align:left;cursor:pointer;background:#fff;border:2.5px solid var(--ink);box-shadow:3px 3px 0 var(--ink);padding:8px 10px;display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:center;color:var(--ink);min-width:0;transition:transform .12s}
.ep-btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
.ep-btn .num{font-family:var(--f-display);font-size:22px;width:34px;height:34px;display:grid;place-items:center;background:var(--page);border:2px solid var(--ink);border-radius:50%}
.ep-btn .tt{font-weight:700;font-size:13.5px;line-height:1.2;min-width:0}
.ep-btn .tt .zh{font-weight:500;font-size:12.5px;color:var(--zh)}
.ep-btn[aria-current="true"]{background:var(--cap)}
.ep-btn[aria-current="true"] .num{background:#fff}

/* episode */
.ep-head{margin:36px 0 16px;display:flex;flex-wrap:wrap;gap:12px 18px;align-items:flex-end}
.ep-no{font-family:var(--f-display);font-size:18px;background:var(--ink);color:var(--cap);padding:6px 12px;transform:rotate(-3deg);letter-spacing:1px}
.ep-no .zh{font-family:var(--f-zhd);color:#fff;font-size:15px}
.ep-title{margin:0;font-family:var(--f-display);font-weight:400;font-size:clamp(30px,5vw,46px);line-height:1;letter-spacing:.5px;text-wrap:balance}
.ep-title .zh{font-family:var(--f-zhd);font-size:.72em;margin-top:6px;color:var(--hot)}
.ep-topic{border:2.5px solid var(--ink);background:#fff;padding:5px 10px;font-weight:700;font-size:14px;border-radius:999px}
.mode-both .ep-topic .en,.mode-both .ep-topic .zh{display:inline}.mode-both .ep-topic .zh::before{content:" / ";color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.panel{margin:0;background:var(--top);border:3px solid var(--ink);box-shadow:5px 5px 0 var(--ink);display:flex;flex-direction:column;overflow:hidden;min-width:0;position:relative}
.pn{position:absolute;top:0;left:0;background:var(--ink);color:#fff;font-family:var(--f-display);font-size:13px;padding:2px 7px 0;z-index:3}
.bubbles{display:flex;flex-direction:column;gap:13px;padding:12px 12px 14px;position:relative;z-index:2}
.art{display:block;width:100%;height:auto;margin-top:auto}
.b{background:#fff;border:2.5px solid var(--ink);border-radius:18px;padding:8px 13px 9px;max-width:90%;position:relative;line-height:1.3;font-weight:700;font-size:15.5px}
.b::after{content:"";position:absolute;bottom:-9px;width:14px;height:14px;background:#fff;border-right:2.5px solid var(--ink);border-bottom:2.5px solid var(--ink);transform:rotate(45deg)}
.b.l{align-self:flex-start}.b.l::after{left:24px}
.b.r{align-self:flex-end}.b.r::after{right:24px}
.b.c{align-self:center}.b.c::after{left:calc(50% - 7px)}
.b .who{display:inline-block;font-family:var(--f-en);font-size:11.5px;letter-spacing:.4px;text-transform:uppercase;color:#fff;background:var(--c);border-radius:999px;padding:1px 8px;margin:0 0 4px -2px}
.mode-zh .b .who{text-transform:none}
.b .zh,.cap .zh{font-weight:500;font-size:14.5px;color:var(--zh);line-height:1.5}
.mode-both .b .zh{border-top:1.5px dashed #C8D0E0;margin-top:5px;padding-top:4px}
.mode-zh .b .zh,.mode-zh .cap .zh{color:var(--ink);font-size:15.5px}
.cap{align-self:flex-start;max-width:92%;background:var(--cap);border:2.5px solid var(--ink);box-shadow:2px 2px 0 var(--ink);padding:5px 11px;font-size:14px;font-weight:700;line-height:1.3;margin-left:22px}
.mode-both .cap .zh{margin-top:2px;font-size:13.5px}
.panel[style*="#0E1A33"] .cap{box-shadow:2px 2px 0 #7DF9FF}

/* glossary + activity */
.after{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:18px;margin-top:26px}
.box{background:#fff;border:3px solid var(--ink);box-shadow:5px 5px 0 var(--ink);padding:16px 18px;min-width:0}
.box h3{margin:0 0 10px;font-family:var(--f-display);font-weight:400;font-size:20px;letter-spacing:.5px}
.box h3 .zh{font-family:var(--f-zhd);font-size:18px}
.mode-both .box h3 .en,.mode-both .box h3 .zh{display:inline}.mode-both .box h3 .zh::before{content:" · ";color:var(--muted)}
.terms{display:grid;gap:10px;margin:0}
.term{display:grid;grid-template-columns:minmax(0,10em) minmax(0,1fr);gap:4px 14px;padding-top:10px;border-top:2px dotted #C8D0E0}
.term:first-child{border-top:0;padding-top:0}
.term dt{font-weight:700;color:var(--leo);font-size:15px;line-height:1.3}
.term dt .zh{color:var(--hot);font-weight:700;font-size:14.5px}
.term dd{margin:0;font-size:14.5px;line-height:1.4}
.term dd .zh{color:var(--zh);font-size:14px;margin-top:2px}
.try{background:var(--cap)}
.try p{margin:0;font-weight:700;line-height:1.45;font-size:15.5px}
.try p .zh{font-weight:500;margin-top:8px;color:var(--ink)}
.try .note{margin-top:14px;font-size:13px;font-weight:700;color:#5a4a10;border-top:2px dashed var(--ink);padding-top:10px}
.try .note .zh{font-weight:500;margin-top:2px}
.nav{display:flex;justify-content:space-between;gap:12px;margin-top:26px}
.nav button{font:inherit;font-weight:700;cursor:pointer;background:#fff;border:2.5px solid var(--ink);box-shadow:3px 3px 0 var(--ink);padding:10px 16px;color:var(--ink);max-width:48%;text-align:left}
.nav button:last-child{text-align:right;margin-left:auto}
.nav button[disabled]{visibility:hidden}
.nav small{display:block;font-size:12px;color:var(--muted)}
.nav .zh{font-weight:500}
.foot{margin-top:40px;text-align:center;color:var(--muted);font-size:13px;font-weight:700}
.foot .zh{font-weight:500}


/* series tabs */
.series{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.sr-btn{font:inherit;text-align:left;cursor:pointer;background:#fff;border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);padding:0;color:var(--ink);min-width:0;display:flex;flex-direction:column;transition:transform .12s}
.sr-btn:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--ink)}
.sr-btn .band{display:flex;align-items:center;gap:8px;background:var(--c);padding:7px 10px;border-bottom:3px solid var(--ink)}
.sr-btn .band svg{width:26px;height:26px;flex:none}
.sr-btn .band b{font-family:var(--f-display);font-weight:400;font-size:19px;color:#fff;-webkit-text-stroke:1px var(--ink);paint-order:stroke fill;letter-spacing:.5px;line-height:1.05}
.sr-btn .band b .zh{font-family:var(--f-zhd);-webkit-text-stroke:0;font-size:15px}
.sr-btn .meta{padding:8px 10px 10px;font-size:13px;font-weight:700;line-height:1.35}
.sr-btn .meta .zh{font-weight:500;color:var(--zh);font-size:12.5px}
.sr-btn .cnt{display:inline-block;margin-top:6px;font-size:11.5px;background:var(--page);border:2px solid var(--ink);border-radius:999px;padding:1px 8px}
.sr-btn[aria-current="true"]{outline:4px solid var(--cap);outline-offset:-1px}
.sr-btn[aria-current="true"] .meta{background:#FFF6CC}
.ep-btn .num{background:var(--sc,var(--page))}
.ep-no{background:var(--sc,var(--ink))}
.grade{margin:-4px 0 0;font-size:13.5px;font-weight:700;color:var(--muted)}
.grade .zh{font-weight:500}
.map{width:100%;border-collapse:collapse;font-size:14px;background:#fff;border:3px solid var(--ink);box-shadow:5px 5px 0 var(--ink)}
.map th,.map td{border-bottom:2px dotted #C8D0E0;padding:9px 12px;text-align:left;vertical-align:top}
.map th{background:var(--ink);color:#fff;font-weight:700}
.map td:first-child{font-weight:700;white-space:nowrap}
.map .zh{color:var(--zh);font-weight:500}
.map-wrap{overflow-x:auto}

@media (max-width:820px){.cast{grid-template-columns:1fr}.after{grid-template-columns:1fr}}
@media (max-width:700px){.grid{grid-template-columns:1fr}.mast{grid-template-columns:1fr}.mast-art{display:none}.b{font-size:15px}.term{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.ep-btn{transition:none}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
const T=(en,zh)=>({en,zh});
const SERIES=[];
// ===== Script: 13 episodes, 6 panels each. cast: [who, x, expression, pose, opts] =====
SERIES.push({id:'ai',icon:'chip',color:'#22B8A7',t:T("AI & Computers","AI与计算机"),
 desc:T("How computers work, from 0s and 1s to machine learning, large language models and AI agents.","计算机如何工作：从0和1，到机器学习、大语言模型和AI智能体。"),
 grade:T("Links to information technology in grades 7–9","对应七至九年级信息科技"),
 episodes:[
// ---------- 1 ----------
{t:T("Meet Bit","遇见比特"),topic:T("What is a computer?","计算机是什么？"),
panels:[
{bg:'room-night',props:[['desk',292],['laptop',292,'glow']],cast:[['leo',160,'worried','idle']],fx:[['sweat','leo']],
 say:[['nar',"Shanghai. Friday, 9 p.m.","上海，周五晚上九点。"],
      ['leo',"The science fair is in 12 weeks and I still have NO idea what to build...","科学节还有12周，我还完全不知道该做什么……"]]},
{bg:'burst',cast:[['leo',95,'surprised','cheer'],['bit',290,'happy','wave',{y:118}]],fx:[['!','leo'],['sparkles',290,110]],
 say:[['bit',"Hi! I'm Bit, the smallest piece of information in a computer. I live in your laptop!","嗨！我是比特，计算机里最小的信息单位。我就住在你的笔记本电脑里！"],
      ['leo',"A ROBOT just came out of my laptop?!","我的电脑里……蹦出来一个机器人？！"]]},
{bg:'room-night',holo:{t:'flow',title:T("What a computer does","计算机做什么"),steps:[{i:'key',l:T("Input","输入")},{i:'chip',l:T("Process","处理")},{i:'screen',l:T("Output","输出")}],foot:T("Keyboard → CPU → Screen","键盘 → CPU → 屏幕")},
 cast:[['leo',54,'think','think'],['bit',356,'talk','present']],
 say:[['leo',"Okay... so what IS a computer, really?","好吧……那计算机到底是什么？"],
      ['bit',"A machine that follows instructions to turn input into output. Super, super fast.","一台按照指令工作的机器：把输入变成输出，而且超级快。"]]},
{bg:'room-night',holo:{t:'list',title:T("Main parts","主要部件"),items:[{i:'chip',l:T("CPU: the brain that calculates","CPU：负责计算的“大脑”")},{i:'desk',l:T("Memory (RAM): the desk for work in progress","内存：放正在做的事的“书桌”")},{i:'shelf',l:T("Storage: the bookshelf that keeps files","硬盘：长期保存文件的“书架”")}]},
 cast:[['leo',54,'surprised','idle'],['bit',356,'talk','present']],
 say:[['bit',"The CPU does billions of tiny steps every second.","CPU每秒能完成几十亿个小步骤。"],
      ['leo',"Billions? Every SECOND?!","几十亿？每一秒？！"]]},
{bg:'room-night',holo:{t:'flow',title:T("Playing a game","玩游戏的时候"),steps:[{i:'key',l:T("Press W","按下W")},{i:'chip',l:T("Run game code","运行游戏代码")},{i:'game',l:T("Player moves","角色前进")}]},
 cast:[['leo',54,'grin','point'],['bit',356,'happy','present']],
 say:[['leo',"So when I press W in my game...","所以我在游戏里按下W键的时候……"],
      ['bit',"The keyboard sends a signal, the CPU runs the game's instructions, and the screen draws you moving. Input, process, output!","键盘发出信号，CPU执行游戏指令，屏幕画出你向前走。输入、处理、输出！"]]},
{bg:'room-night',cast:[['leo',125,'determined','point'],['bit',285,'wink','wave']],
 say:[['leo',"Bit, help me build an AI for the science fair!","比特，帮我做一个AI去参加科学节吧！"],
      ['bit',"Deal! But first you need to know how computers think. Lesson one tomorrow: zeros and ones.","成交！不过你得先弄懂计算机是怎么“思考”的。明天第一课：0和1。"]]}
],
terms:[["Input / Output","输入 / 输出","Information going in (keyboard, mic, camera) and coming out (screen, speaker).","进入计算机的信息（键盘、麦克风、摄像头）和出来的信息（屏幕、音箱）。"],
 ["CPU","中央处理器（CPU）","The chip that carries out instructions, billions every second.","执行指令的芯片，每秒执行几十亿条。"],
 ["Memory (RAM)","内存","Fast, temporary space for what is running now. Cleared when the power goes off.","存放正在运行内容的高速临时空间，断电就清空。"],
 ["Storage","存储（硬盘）","Keeps your files even when the power is off.","断电后也能保存文件。"]],
tryIt:T("Walk around your home and list 5 input devices and 5 output devices. Is a touchscreen input or output?","在家里找一找：列出5个输入设备和5个输出设备。触摸屏算输入还是输出？")},

// ---------- 2 ----------
{t:T("Zeros and Ones","0和1的秘密"),topic:T("Binary","二进制"),
panels:[
{bg:'kitchen',props:[['table',205],['bowl',205,172]],cast:[['leo',100,'surprised','idle'],['bit',300,'talk','wave',{y:100}]],
 say:[['nar',"Saturday breakfast.","周六早餐时间。"],
      ['bit',"Everything in a computer is stored as 0s and 1s.","计算机里的一切，都是用0和1存起来的。"],
      ['leo',"Everything? Even my photos and game saves?","一切？连我的照片和游戏存档也是？"]]},
{bg:'kitchen',holo:{t:'bulbs',title:T("One switch = one bit","一个开关 = 一个比特"),bits:'01',caps:[T("OFF","关"),T("ON","开")]},
 cast:[['leo',54,'think','think'],['bit',356,'happy','present']],
 say:[['bit',"Inside the chip are billions of tiny switches. Off means 0, on means 1. One switch is one bit. That's me!","芯片里有几十亿个微小的开关。关代表0，开代表1。一个开关就是一个比特——就是我！"]]},
{bg:'kitchen',holo:{t:'bulbs',title:T("8 bits = 1 byte","8个比特 = 1个字节"),bits:'10110010',pv:true,foot:T("2⁸ = 256 patterns","2⁸ = 256 种组合")},
 cast:[['leo',54,'grin','point'],['bit',356,'talk','present']],
 say:[['bit',"Put 8 bits together and you get a byte. 8 switches can make 256 different patterns.","把8个比特放在一起，就是1个字节。8个开关能组成256种不同的图案。"],
      ['leo',"2×2×2×2×2×2×2×2... that's 256!","2×2×2×2×2×2×2×2……正好256！"]]},
{bg:'kitchen',holo:{t:'big',title:T("Letters are numbers","文字也是数字"),rows:[{s:'A = 65',size:22},{s:'= 01000001',size:15,mono:true,fill:'#C2416B'},{s:'中 = 20013',size:22}]},
 cast:[['leo',54,'surprised','idle'],['bit',356,'talk','present']],

// ===== Drawing engine =====
let MODE='both';
const INK='#17182B', HT='#0B4F5C', HL='#18A3B5', HF='#ECFDFF', ZH_T='#3D7380', HOT='#C2416B', TEAL='#22B8A7';
const n1=v=>Math.round(v*10)/10;
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const isObj=t=>t!==null&&typeof t==='object';
const pick=t=>isObj(t)?(MODE==='zh'?t.zh:t.en):t;

// ---------- text measuring + wrapping for SVG ----------
function tw(str,size,mono){let w=0;for(const ch of str){const c=ch.codePointAt(0);
  if(c>=0x2E80) w+=size; else if(mono) w+=size*0.6; else if(ch===' ') w+=size*0.3;
  else if(/[A-Z]/.test(ch)) w+=size*0.64; else if(/[ilj.,:;'!|()]/.test(ch)) w+=size*0.32;
  else if(/[mwMW]/.test(ch)) w+=size*0.82; else w+=size*0.55;}return w*1.04;}
const NOSTART='，。！？、；：）》」』”’…%';
function wrap(s,maxW,size,mono){
  if(!maxW) return [s];
  const toks=String(s).match(/[^\s⺀-￿]+|\s+|[⺀-￿]/g)||[''];
  const lines=[];let cur='';
  for(const t of toks){
    if(/^\s+$/.test(t)){ if(cur) cur+=' '; continue; }
    const test=cur+t;
    if(tw(test,size,mono)>maxW && cur.trim() && !NOSTART.includes(t)){ lines.push(cur.trim()); cur=t; }
    else cur=test;
  }
  if(cur.trim()) lines.push(cur.trim());
  return lines.length?lines:[''];
}
// st: draw (possibly bilingual) text block whose TOP is at y. returns {s,h}
function st(x,y,txt,o={}){
  const size=o.size||11,a=o.a||'middle',fill=o.fill||HT,wt=o.w||700,maxW=o.maxW;
  const parts=[];
  if(!isObj(txt)) parts.push({t:String(txt),size,cls:o.mono?'sv-mono':'sv-en',fill});
  else{
    if(MODE!=='zh') parts.push({t:txt.en,size,cls:'sv-en',fill});
    if(MODE!=='en') parts.push({t:txt.zh,size:MODE==='both'?size*0.9:size,cls:'sv-zh',fill:MODE==='both'?(o.zfill||ZH_T):fill});
  }
  let out='',cy=y;
  for(const p of parts){
    for(const ln of wrap(p.t,maxW,p.size,o.mono&&!isObj(txt))){
      cy+=p.size;
      out+=`<text x="${n1(x)}" y="${n1(cy)}" text-anchor="${a}" font-size="${n1(p.size)}" fill="${p.fill}" font-weight="${wt}" class="${p.cls}">${esc(ln)}</text>`;
      cy+=p.size*0.24;
    }
  }
  return {s:out,h:cy-y};
}
const stH=(t,o)=>st(0,0,t,o).h;
function ah(x,y,ang,col=HL,sz=7){const a1=ang+2.62,a2=ang-2.62;return `<polygon points="${n1(x)},${n1(y)} ${n1(x+sz*Math.cos(a1))},${n1(y+sz*Math.sin(a1))} ${n1(x+sz*Math.cos(a2))},${n1(y+sz*Math.sin(a2))}" fill="${col}"/>`;}
function arrow(x1,y1,x2,y2,col=HL,w=2){const a=Math.atan2(y2-y1,x2-x1);return `<line x1="${n1(x1)}" y1="${n1(y1)}" x2="${n1(x2-Math.cos(a)*5)}" y2="${n1(y2-Math.sin(a)*5)}" stroke="${col}" stroke-width="${w}" stroke-linecap="round"/>`+ah(x2,y2,a,col);}

function cup(c){return `<path d="M-10 -12 L10 -12 L8 13 L-8 13 Z" fill="#fff" fill-opacity=".6" stroke="${INK}" stroke-width="1.6"/><path d="M-9 -4 L9 -4 L8 13 L-8 13 Z" fill="${c}"/><path d="M-10 -12 L10 -12 L8 13 L-8 13 Z" fill="none" stroke="${INK}" stroke-width="1.6"/>`;}

// ---------- helpers ----------
const lineS=(x1,y1,x2,y2,c=INK,w=2,extra='')=>`<line x1="${n1(x1)}" y1="${n1(y1)}" x2="${n1(x2)}" y2="${n1(y2)}" stroke="${c}" stroke-width="${w}" stroke-linecap="round" ${extra}/>`;
function wedge(cx,cy,r,a1,a2,fill){const p1=[cx+r*Math.cos(a1),cy+r*Math.sin(a1)],p2=[cx+r*Math.cos(a2),cy+r*Math.sin(a2)];const large=Math.abs(a2-a1)>Math.PI?1:0;
  return `<path d="M${n1(cx)} ${n1(cy)} L${n1(p1[0])} ${n1(p1[1])} A${r} ${r} 0 ${large} 1 ${n1(p2[0])} ${n1(p2[1])} Z" fill="${fill}" stroke="${INK}" stroke-width="1.2"/>`;}
function footOf(d,B,size=10.5){const fo={size,maxW:B.w,fill:HOT};const h=d.foot?stH(d.foot,fo)+4:0;return {h,draw:()=>d.foot?st(B.x+B.w/2,B.y+B.h-h+4,d.foot,fo).s:''};}
function seeded(n){let s=n*9301+49297;return()=>{s=(s*9301+49297)%233280;return s/233280;};}

// ---------- math diagrams ----------
DIAG.area=(d,B)=>{let s='';const F=footOf(d,B,11);const S=Math.min(B.w-34,B.h-F.h-16),x0=B.x+(B.w-S)/2+8,y0=B.y+12,a=S*0.62,b=S-a;
  [[x0,y0,a,a,'#CFF5EF','a²'],[x0+a,y0,b,a,'#FFE7A3','ab'],[x0,y0+a,a,b,'#FFE7A3','ab'],[x0+a,y0+a,b,b,'#FFD6D6','b²']].forEach(([x,y,w,h,c,l])=>{
    s+=`<rect x="${n1(x)}" y="${n1(y)}" width="${n1(w)}" height="${n1(h)}" fill="${c}" stroke="${INK}" stroke-width="1.6"/><text x="${n1(x+w/2)}" y="${n1(y+h/2+5)}" font-size="${w>40?16:12}" text-anchor="middle" font-weight="700" fill="${INK}" class="sv-mono">${l}</text>`;});
  const T2=(x,y,t)=>`<text x="${n1(x)}" y="${n1(y)}" font-size="12" text-anchor="middle" font-weight="700" fill="${HOT}" class="sv-mono">${t}</text>`;
  s+=T2(x0+a/2,y0-3,'a')+T2(x0+a+b/2,y0-3,'b')+T2(x0-9,y0+a/2+4,'a')+T2(x0-9,y0+a+b/2+4,'b');
  return s+F.draw();};
DIAG.tiles=(d,B)=>{let s='';const p=d.p,q=d.q,F=footOf(d,B,10.5);const u=13,X=Math.min(62,B.h-F.h-p*u-34),W=X+q*u,H=X+p*u,x0=B.x+(B.w-W)/2+10,y0=B.y+20;
  const R=(x,y,w,h,c)=>`<rect x="${n1(x)}" y="${n1(y)}" width="${n1(w)}" height="${n1(h)}" fill="${c}" stroke="${INK}" stroke-width="1.3"/>`;
  s+=R(x0,y0,X,X,'#CFF5EF')+`<text x="${n1(x0+X/2)}" y="${n1(y0+X/2+6)}" font-size="16" text-anchor="middle" font-weight="700" class="sv-mono" fill="${INK}">x²</text>`;
  for(let i=0;i<q;i++) s+=R(x0+X+i*u,y0,u,X,'#FFE7A3');
  for(let j=0;j<p;j++) s+=R(x0,y0+X+j*u,X,u,'#FFE7A3');
  for(let i=0;i<q;i++) for(let j=0;j<p;j++) s+=R(x0+X+i*u,y0+X+j*u,u,u,'#FFD6D6');
  s+=`<text x="${n1(x0+W/2)}" y="${n1(y0-6)}" font-size="12" text-anchor="middle" font-weight="700" fill="${HOT}" class="sv-mono">x + ${q}</text>`;
  s+=`<text transform="translate(${n1(x0-8)},${n1(y0+H/2)}) rotate(-90)" font-size="12" text-anchor="middle" font-weight="700" fill="${HOT}" class="sv-mono">x + ${p}</text>`;
  return s+F.draw();};
DIAG.sqrt2=(d,B)=>{let s='';const F=footOf(d,B,11);const G=Math.min(B.w*0.62,B.h-F.h-10),c=G/2,x0=B.x+(B.w-G)/2,y0=B.y+4;
  s+=`<rect x="${n1(x0)}" y="${n1(y0)}" width="${n1(G)}" height="${n1(G)}" fill="#fff" stroke="${INK}" stroke-width="1.6"/>`+lineS(x0+c,y0,x0+c,y0+G,'#B9D7DD',1.4)+lineS(x0,y0+c,x0+G,y0+c,'#B9D7DD',1.4);
  s+=`<path d="M${n1(x0+c)} ${n1(y0)} L${n1(x0+G)} ${n1(y0+c)} L${n1(x0+c)} ${n1(y0+G)} L${n1(x0)} ${n1(y0+c)} Z" fill="#FFD6D6" fill-opacity=".85" stroke="${HOT}" stroke-width="2.4"/>`;
  s+=st(x0+c,y0+c-stH(T("area = 2","面积 = 2"),{size:10.5})/2,T("area = 2","面积 = 2"),{size:10.5,fill:HOT}).s;
  s+=`<text x="${n1(x0+c/2)}" y="${n1(y0+G+12)}" font-size="11" text-anchor="middle" font-weight="700" class="sv-mono" fill="${HT}">1</text>`;
  s+=`<text x="${n1(x0+G*0.86)}" y="${n1(y0+G*0.2)}" font-size="13" text-anchor="start" font-weight="700" class="sv-mono" fill="${HOT}">√2</text>`;
  return s+F.draw();};
DIAG.numline2=(d,B)=>{let s='';const lo=d.min,hi=d.max,x0=B.x+8,x1=B.x+B.w-8,y=B.y+B.h*0.5,mp=v=>x0+(v-lo)/(hi-lo)*(x1-x0);
  s+=arrow(x0-4,y,x1+6,y,INK,2);for(let v=lo;v<=hi;v++) s+=lineS(mp(v),y-4,mp(v),y+4,INK,1.6)+`<text x="${n1(mp(v))}" y="${n1(y+16)}" font-size="9.5" text-anchor="middle" class="sv-mono" fill="${ZH_T}">${v<0?'−'+(-v):v}</text>`;
  d.pts.forEach((p,i)=>{const x=mp(p.v),c=p.irr?CORAL:BLUE,up=i%2===0;s+=`<circle cx="${n1(x)}" cy="${n1(y)}" r="5" fill="${c}" stroke="${INK}" stroke-width="1.4"/>`+lineS(x,y-6,x,up?y-24:y-14,c,1.4)+`<text x="${n1(x)}" y="${n1(up?y-28:y-18)}" font-size="13" text-anchor="middle" font-weight="700" class="sv-mono" fill="${c}">${p.l}</text>`;});
  const lo2={size:10,a:'start'};s+=`<circle cx="${B.x+6}" cy="${n1(B.y+B.h-22)}" r="5" fill="${BLUE}"/>`+st(B.x+15,B.y+B.h-30,T("Rational","有理数"),{...lo2,fill:BLUE}).s;
  s+=`<circle cx="${n1(B.x+B.w/2+6)}" cy="${n1(B.y+B.h-22)}" r="5" fill="${CORAL}"/>`+st(B.x+B.w/2+15,B.y+B.h-30,T("Irrational","无理数"),{...lo2,fill:CORAL}).s;return s;};
DIAG.angles=(d,B)=>{let s='';const F=footOf(d,B,10);const H=B.h-F.h,y1=B.y+H*0.32,y2=B.y+H*0.72,xa=B.x+B.w*0.22,ya=B.y+H-4,xb=B.x+B.w*0.72,yb=B.y+6;
  const ix=yy=>xa+(xb-xa)*(ya-yy)/(ya-yb);[y1,y2].forEach(yy=>{s+=lineS(B.x,yy,B.x+B.w,yy,INK,2.2)+`<path d="M${n1(B.x+B.w-26)} ${n1(yy-4)} L${n1(B.x+B.w-20)} ${n1(yy)} L${n1(B.x+B.w-26)} ${n1(yy+4)}" stroke="${INK}" stroke-width="1.8" fill="none"/>`;});
  const t=Math.atan2(ya-yb,xb-xa);[[y1,'1'],[y2,'2']].forEach(([yy,l])=>{const x=ix(yy);s+=wedge(x,yy,16,-t,0,'#FFB8C6');s+=`<text x="${n1(x+20)}" y="${n1(yy-6)}" font-size="12" font-weight="700" class="sv-mono" fill="${HOT}">${l}</text>`;});
  s+=lineS(xa,ya,xb,yb,BLUE,2.4);return s+F.draw();};
DIAG.tri=(d,B)=>{let s='';const F=footOf(d,B,10.5);const H=B.h-F.h,ty=B.y+4;const A=[B.x+14,ty+H*0.5],Bv=[B.x+B.w-14,ty+H*0.5],C=[B.x+B.w*0.38,ty];const cols=['#FFB8C6','#FFE45C','#9FD4F7'];
  const ang=(V,P,Q)=>{const a1=Math.atan2(P[1]-V[1],P[0]-V[0]),a2=Math.atan2(Q[1]-V[1],Q[0]-V[0]);let dA=a2-a1;while(dA<0)dA+=2*Math.PI;if(dA>Math.PI){return [a2,a1+2*Math.PI-0]} return [a1,a2];};
  const angs=[];[[A,Bv,C],[Bv,C,A],[C,A,Bv]].forEach(([V,P,Q],i)=>{let [a1,a2]=ang(V,P,Q);if(a2<a1)a2+=2*Math.PI;angs.push(a2-a1);s+=wedge(V[0],V[1],15,a1,a2,cols[i]);});
  s+=`<path d="M${n1(A[0])} ${n1(A[1])} L${n1(Bv[0])} ${n1(Bv[1])} L${n1(C[0])} ${n1(C[1])} Z" fill="none" stroke="${INK}" stroke-width="2.2" stroke-linejoin="round"/>`;
  const px=B.x+B.w/2,py=ty+H-6;s+=lineS(px-60,py,px+60,py,INK,2);let a=Math.PI;angs.forEach((g,i)=>{s+=wedge(px,py,26,a,a+g,cols[i]);a+=g;});
  s+=`<text x="${n1(px)}" y="${n1(py-30)}" font-size="11" text-anchor="middle" font-weight="700" class="sv-mono" fill="${HOT}">180°</text>`;
  s+=arrow(px,ty+H*0.5+10,px,py-32,HL,1.8);return s+F.draw();};
DIAG.truss=(d,B)=>{let s='';const cw=B.w/2,lo={size:9.5,maxW:cw-6,fill:INK};const lh=Math.max(stH(T("Square: squashes","正方形：会变形"),lo),stH(T("Triangle: stays firm","三角形：保持稳固"),lo));
  const base=B.y+B.h-lh-8,side=Math.min(cw-30,base-B.y-26);
  const sx=B.x+(cw-side)/2,sy=base-side;s+=`<rect x="${n1(sx)}" y="${n1(sy)}" width="${n1(side)}" height="${n1(side)}" fill="none" stroke="${INK}" stroke-width="2.4"/>`;
  s+=`<path d="M${n1(sx)} ${n1(base)} L${n1(sx+side)} ${n1(base)} L${n1(sx+side+side*0.45)} ${n1(sy+side*0.15)} L${n1(sx+side*0.45)} ${n1(sy+side*0.15)} Z" fill="none" stroke="${CORAL}" stroke-width="2" stroke-dasharray="4 3"/>`;
  s+=arrow(sx-10,sy+6,sx+12,sy+6,CORAL,2.4)+icon('cross',sx+side+8,sy-4,0.7);
  const tx=B.x+cw+cw/2;s+=`<path d="M${n1(tx-side/2-4)} ${n1(base)} L${n1(tx+side/2+4)} ${n1(base)} L${n1(tx)} ${n1(sy)} Z" fill="none" stroke="${INK}" stroke-width="2.4" stroke-linejoin="round"/>`+arrow(tx-24,sy+6,tx-4,sy+6,CORAL,2.4)+icon('check',tx+side/2+8,sy-4,0.7);
  s+=st(B.x+cw/2,base+6,T("Square: squashes","正方形：会变形"),lo).s+st(B.x+cw*1.5,base+6,T("Triangle: stays firm","三角形：保持稳固"),lo).s;return s;};
DIAG.coords=(d,B)=>{let s='';const [xa,xb]=d.xr||[0,6],[ya,yb]=d.yr||[0,5];const nx=xb-xa,ny=yb-ya;const c=Math.min((B.w-16)/nx,(B.h-14)/ny);const W=c*nx,H=c*ny,x0=B.x+(B.w-W)/2+4,y0=B.y+4;
  const X=v=>x0+(v-xa)*c,Y=v=>y0+(yb-v)*c;
  for(let v=xa;v<=xb;v++) s+=lineS(X(v),y0,X(v),y0+H,'#C9DDE2',1);for(let v=ya;v<=yb;v++) s+=lineS(x0,Y(v),x0+W,Y(v),'#C9DDE2',1);
  s+=arrow(x0,Y(0),x0+W+6,Y(0),INK,1.8)+arrow(X(0),y0+H,X(0),y0-4,INK,1.8);
  s+=`<text x="${n1(x0+W+4)}" y="${n1(Y(0)+12)}" font-size="10" font-weight="700" class="sv-mono" fill="${INK}">x</text><text x="${n1(X(0)+5)}" y="${n1(y0+4)}" font-size="10" font-weight="700" class="sv-mono" fill="${INK}">y</text><text x="${n1(X(0)-7)}" y="${n1(Y(0)+11)}" font-size="9" class="sv-mono" fill="${ZH_T}">O</text>`;
  for(let v=xa;v<=xb;v++) if(v) s+=`<text x="${n1(X(v))}" y="${n1(Y(0)+11)}" font-size="8" text-anchor="middle" class="sv-mono" fill="${ZH_T}">${v<0?'−'+(-v):v}</text>`;
  for(let v=ya;v<=yb;v++) if(v) s+=`<text x="${n1(X(0)-4)}" y="${n1(Y(v)+3)}" font-size="8" text-anchor="end" class="sv-mono" fill="${ZH_T}">${v<0?'−'+(-v):v}</text>`;
  if(d.walk) s+=`<path d="M${n1(X(0))} ${n1(Y(0))} L${n1(X(d.walk[0]))} ${n1(Y(0))} L${n1(X(d.walk[0]))} ${n1(Y(d.walk[1]))}" fill="none" stroke="${HOT}" stroke-width="2.4" stroke-dasharray="5 3"/>`;
  if(d.poly) s+=`<polygon points="${d.poly.map(p=>n1(X(p[0]))+','+n1(Y(p[1]))).join(' ')}" fill="#FFE7A3" fill-opacity=".8" stroke="${INK}" stroke-width="2"/>`;
  (d.pts||[]).forEach(p=>{const x=X(p.x),y=Y(p.y);s+=`<circle cx="${n1(x)}" cy="${n1(y)}" r="5" fill="${p.c||CORAL}" stroke="${INK}" stroke-width="1.4"/>`;
    if(p.l){const o={size:9,a:p.x>=xb-1?'end':'start',fill:INK,maxW:70};s+=st(x+(o.a==='end'?-6:6),y-stH(p.l,o)-1,p.l,o).s;}});
  return s;};

// ---------- physics diagrams ----------
DIAG.wave=(d,B)=>{let s='';const rh=B.h/d.rows.length;d.rows.forEach((r,i)=>{const y=B.y+rh*i;const lo={size:10,a:'start',maxW:B.w};const lh=stH(r.l,lo);s+=st(B.x,y+1,r.l,lo).s;
  const cy=y+lh+(rh-lh)/2,amp=(rh-lh)*0.36*r.a;let p='';for(let k=0;k<=80;k++){const x=B.x+B.w*k/80,yy=cy-amp*Math.sin(k/80*r.f*2*Math.PI);p+=(k?'L':'M')+n1(x)+' '+n1(yy);}

const CAST=[
  {k:'leo',name:NAMES.leo,bio:T("13, lives in Shanghai. Loves football and video games. Curious about everything.","13岁，住在上海。爱踢足球、爱打游戏，对什么都好奇。")},
  {k:'bit',name:NAMES.bit,bio:T("A pocket-sized robot who lives in Leo's laptop. Named after the smallest unit of information.","住在乐乐笔记本电脑里的口袋机器人，名字来自最小的信息单位。")},
  {k:'mia',name:NAMES.mia,bio:T("Leo's classmate. Sharp and skeptical. Always asks: how do you know?","乐乐的同学。聪明、爱质疑，总爱问：你怎么知道？")},
];
const UI={
  tag:T("Comic series for curious 13-year-olds: AI, math, physics, chemistry and engineering, linked to what they learn at school.","写给13岁好奇少年的系列漫画：人工智能、数学、物理、化学和工程，紧扣校内所学。"),
  cast:T("Meet the cast","主要角色"),series:T("Series","系列"),eps:T("Episodes","剧集"),terms:T("Key words","关键词"),tryIt:T("Try it","动手试试"),
  prev:T("Previous","上一集"),next:T("Next","下一集"),episodes:T("episodes","集"),
  note:T("Parents: read one episode a week together, then do the activity.","家长小贴士：每周一起读一集，再完成这个小活动。"),
  parents:T("For parents: how it links to school","给家长：与校内课程的对应"),
  thS:T("Series","系列"),thL:T("Links to","对应课程"),thT:T("Topics","内容"),
  foot:T("Leo, Bit and Mia are original characters. Curriculum links checked against Shanghai's 2024–2026 textbook lists and the 2022 national curriculum standards.","乐乐、比特和米娅均为原创角色。课程对应关系参照上海2024—2026年教学用书目录及2022年版义务教育课程标准。"),
};
let SI=0,CUR=0;
const findS=id=>SERIES.findIndex(s=>s.id===id);
try{const m=localStorage.getItem('lb-mode');if(m==='en'||m==='zh'||m==='both')MODE=m;
  const ss=findS(localStorage.getItem('lb-series')||'');if(ss>=0)SI=ss;const e=parseInt(localStorage.getItem('lb-ep'),10);if(e>=0&&e<SERIES[SI].episodes.length)CUR=e;}catch(e){}
(function(){const h=location.hash;let m=/^#ep(\d+)$/.exec(h);if(m){SI=0;CUR=Math.min(SERIES[0].episodes.length,Math.max(1,+m[1]))-1;return;}
  m=/^#([a-z]+)-(\d+)$/.exec(h);if(m){const s=findS(m[1]);if(s>=0){SI=s;CUR=Math.min(SERIES[s].episodes.length,Math.max(1,+m[2]))-1;}}})();

function portrait(k){if(k==='bit') return `<svg viewBox="-56 -60 112 128" aria-hidden="true">${bit(0,0,1,1.25,'happy','wave')}</svg>`;
  return `<svg viewBox="-62 -212 124 220" aria-hidden="true">${person(k,0,0,1,1,k==='mia'?'smirk':'happy',k==='leo'?'wave':'idle')}</svg>`;}
function epNo(i){return MODE==='zh'?`<span class="zh">第${i+1}集</span>`:MODE==='en'?`<span class="en">EPISODE ${i+1}</span>`:`<span class="en">EPISODE ${i+1}</span><span class="zh">第${i+1}集</span>`;}
function cnt(n){return MODE==='zh'?`${n}集`:MODE==='en'?`${n} episodes`:`${n} episodes · ${n}集`;}
function render(){
  const app=document.getElementById('app');document.documentElement.lang=MODE==='zh'?'zh-CN':'en';
  document.body.className='mode-'+MODE;
  const S=SERIES[SI],E=S.episodes[CUR];
  const langs=[['both','EN + 中文'],['en','English'],['zh','中文']].map(([m,l])=>`<button type="button" data-mode="${m}" aria-pressed="${MODE===m}">${l}</button>`).join('');
  let h=`<header class="mast"><div><h1 class="logo">Leo &amp; Bit</h1><p class="logo-zh">乐乐和比特的科学大冒险</p><p class="tag">${hx(UI.tag)}</p><div class="langs" role="group" aria-label="Language">${langs}</div></div>
    <svg class="mast-art" viewBox="0 -215 260 225" aria-hidden="true">${person('leo',80,0,1,1,'grin','point')}${bit(200,-120,-1,1.3,'happy','wave')}</svg></header>`;
  h+=`<h2 class="sh">${hx(UI.cast)}</h2><div class="cast">${CAST.map(c=>`<div class="cc" style="--c:${c.name.c}">${portrait(c.k)}<div><h3>${hx(c.name)}</h3><p>${hx(c.bio)}</p></div></div>`).join('')}</div>`;
  h+=`<h2 class="sh">${hx(UI.series)}</h2><nav class="series" aria-label="Series">${SERIES.map((s,i)=>`<button type="button" class="sr-btn" data-series="${i}" aria-current="${i===SI}" style="--c:${s.color}"><span class="band"><svg viewBox="-13 -13 26 26" aria-hidden="true"><circle r="12.5" fill="#fff" stroke="#17182B" stroke-width="1.5"/>${icon(s.icon,0,0,0.85)}</svg><b>${hx(s.t)}</b></span><span class="meta">${hx(s.grade)}<span class="cnt">${cnt(s.episodes.length)}</span></span></button>`).join('')}</nav>`;
  h+=`<h2 class="sh">${hx(S.t)}</h2><p class="grade">${hx(S.desc)}</p><nav class="eps" aria-label="Episodes" style="margin-top:12px;--sc:${S.color}">${S.episodes.map((e,i)=>`<button type="button" class="ep-btn" data-ep="${i}" aria-current="${i===CUR}"><span class="num">${i+1}</span><span class="tt">${hx(e.t)}</span></button>`).join('')}</nav>`;
  h+=`<section id="episode" style="--sc:${S.color}"><div class="ep-head"><span class="ep-no">${epNo(CUR)}</span><h2 class="ep-title">${hx(E.t)}</h2><span class="ep-topic">${hx(E.topic)}</span></div>`;
  h+=`<div class="grid">${E.panels.map(panelHTML).join('')}</div>`;
  h+=`<div class="after"><div class="box"><h3>${hx(UI.terms)}</h3><dl class="terms">${E.terms.map(t=>`<div class="term"><dt>${hx({en:t[0],zh:t[1]})}</dt><dd>${hx({en:t[2],zh:t[3]})}</dd></div>`).join('')}</dl></div>
    <div class="box try"><h3>${hx(UI.tryIt)}</h3><p>${hx(E.tryIt)}</p><div class="note">${hx(UI.note)}</div></div></div>`;
  const pv=neighbour(-1),nx=neighbour(1);const lab=(n)=>n?`${n.si!==SI?hx(SERIES[n.si].t)+' · ':''}${hx(SERIES[n.si].episodes[n.e].t)}`:'';
  h+=`<div class="nav"><button type="button" data-go="${pv?pv.si+':'+pv.e:''}" ${pv?'':'disabled'}><small>← ${hx(UI.prev)}</small>${lab(pv)}</button><button type="button" data-go="${nx?nx.si+':'+nx.e:''}" ${nx?'':'disabled'}><small>${hx(UI.next)} →</small>${lab(nx)}</button></div></section>`;
  h+=`<h2 class="sh">${hx(UI.parents)}</h2><div class="map-wrap"><table class="map"><thead><tr><th>${hx(UI.thS)}</th><th>${hx(UI.thL)}</th><th>${hx(UI.thT)}</th></tr></thead><tbody>${SERIES.map(s=>`<tr><td>${hx(s.t)}</td><td>${hx(s.grade)}</td><td>${hx(s.desc)}</td></tr>`).join('')}</tbody></table></div>`;
  h+=`<p class="foot">${hx(UI.foot)}</p>`;
  app.innerHTML=h;
}
function neighbour(d){let si=SI,e=CUR+d;if(e<0){si--;if(si<0)return null;e=SERIES[si].episodes.length-1;}else if(e>=SERIES[si].episodes.length){si++;if(si>=SERIES.length)return null;e=0;}return {si,e};}
function go(si,e,scroll,target){SI=si;CUR=e;try{localStorage.setItem('lb-series',SERIES[si].id);localStorage.setItem('lb-ep',String(e));}catch(err){}
  try{history.replaceState(null,'','#'+SERIES[si].id+'-'+(e+1));}catch(err){}
  render();if(scroll){const el=document.getElementById(target||'episode');if(el)el.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'});}}
document.addEventListener('click',ev=>{const t=ev.target.closest('button');if(!t)return;
  if(t.dataset.mode){MODE=t.dataset.mode;try{localStorage.setItem('lb-mode',MODE);}catch(e){}render();}
  else if(t.dataset.series!==undefined){go(+t.dataset.series,0,false);}
  else if(t.dataset.ep!==undefined) go(SI,+t.dataset.ep,true);
  else if(t.dataset.go){const [a,b]=t.dataset.go.split(':');go(+a,+b,true);}});
render();
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>render());
</script>
</body>
</html>
